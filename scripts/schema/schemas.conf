# /etc/nginx/conf.d/schemas.conf
#
# Placed in conf.d/ so it is picked up by the stock nginx.conf include.
# The nginx-unprivileged base image owns /etc/nginx/conf.d/ as UID 101,
# so this file is readable at runtime without any permission gymnastics.
#
# We deliberately do NOT replace /etc/nginx/nginx.conf. The stock config
# already sets:
#   - pid       /tmp/nginx.pid
#   - all *_temp_path under /tmp/
#   - include /etc/nginx/conf.d/*.conf
# Overriding it from a COPY instruction creates a root-owned file that
# nginx (UID 101) cannot open — which is exactly the permission error
# this file structure is designed to avoid.

# ── Extra MIME types ───────────────────────────────────────────────────────
# Placed inside the server block's parent (http context) via types{} here
# would be invalid; we use the `types` block inside the server block instead,
# which nginx merges with the http-level types from mime.types.
# See: http://nginx.org/en/docs/http/ngx_http_core_module.html#types

# ── gzip ───────────────────────────────────────────────────────────────────
# Stock config has gzip off. We turn it on for all text-based formats.
# This directive is valid at http context — conf.d files are included inside
# the http{} block by the stock nginx.conf, so this is correct placement.
gzip              on;
gzip_vary         on;
gzip_min_length   512;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types
    application/json
    application/schema+json
    application/ld+json
    application/yaml
    text/plain
    text/html
    text/markdown;

# ── Server block ───────────────────────────────────────────────────────────
server {
    listen      8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html index.json;

    # nginx is behind Traefik. Without absolute_redirect off, nginx constructs
    # Location headers using its own listen address — emitting
    # http://schemas.blockchain-applied.com:8080/cardano_on_bigquery/
    # instead of a relative path that the browser resolves against the
    # original https:// origin. Relative redirects are safe here because
    # Traefik handles the scheme and port before the client ever sees them.
    absolute_redirect off;

    # Also suppress the server_name-based port in redirects.
    port_in_redirect  off;

    # Override MIME types for our specific extensions.
    # Merges with the http-level types from mime.types.
    types {
        application/schema+json   json;    # replaces application/json for .json
        application/ld+json       jsonld;
        application/yaml          yaml yml;
        text/markdown             md;
        text/html                 html;
    }

    # ── CORS ───────────────────────────────────────────────────────────────
    add_header Access-Control-Allow-Origin  "*"                   always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS"  always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
    add_header Access-Control-Max-Age       "86400"               always;

    # Cache: schemas refresh daily, 5 min is safe
    add_header Cache-Control "public, max-age=300, must-revalidate" always;

    # Security
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer" always;

    server_tokens off;

    # ── Pre-flight short-circuit ────────────────────────────────────────────
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Routes ─────────────────────────────────────────────────────────────

    # Root → redirect to the dataset prefix
    location = / {
        #return 302 /cardano_on_bigquery/;
        try_files /index.html =404;
    }

    # Dataset root: index.html if present, else index.json
    location = /cardano_on_bigquery/ {
        try_files /cardano_on_bigquery/index.html /cardano_on_bigquery/index.json =404;
    }

    # K8s liveness / readiness probe endpoint
    location = /healthz {
        access_log   off;
        default_type "text/plain";
        return 200   "ok\n";
    }

    # Static file serving
    location /cardano_on_bigquery/ {
        autoindex off;
        try_files $uri =404;
    }

    # JSON 404 body so agents get a parseable error
    error_page 404 = @json404;
    location @json404 {
        default_type application/json;
        return 404 '{"error":"not_found","message":"No schema at this path. See /cardano_on_bigquery/index.json for the catalogue."}\n';
    }
}
